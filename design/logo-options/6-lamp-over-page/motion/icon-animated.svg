<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
<title>BetterReads — Lamp over the page, animated (the lamp rises behind the pages; ends on the static icon)</title>
<style>
.pages{animation:br-pages 450ms cubic-bezier(0.2,0,0,1) both}
.sun{animation:br-sun 1600ms cubic-bezier(0.2,0,0,1) 150ms both}
.glow{animation:br-glow 1600ms cubic-bezier(0.45,0,0.55,1) 300ms both}
@keyframes br-pages{from{opacity:0;transform:translateY(6px)}}
@keyframes br-sun{from{transform:translateY(34px)}}
@keyframes br-glow{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.pages,.sun,.glow{animation:none}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="108" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3c3251"/><stop offset="1" stop-color="#211b2e"/></linearGradient><radialGradient id="gl" cx="54" cy="43.1" r="54" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#efb768" stop-opacity="0.4"/><stop offset="0.4" stop-color="#efb768" stop-opacity="0.14"/><stop offset="1" stop-color="#efb768" stop-opacity="0"/></radialGradient><clipPath id="sky"><path d="M0 0H100V58H90C74 52 58 54 50 66C42 54 26 52 10 58H0Z"/></clipPath></defs>
<rect width="108" height="108" fill="url(#bg)"/><rect class="glow" width="108" height="108" fill="url(#gl)"/>
<g transform="translate(18.26 10.22) scale(0.7149)"><g clip-path="url(#sky)"><path class="sun" fill="#efb768" d="M50 36.5A18.5 18.5 0 1 1 50 73.5A18.5 18.5 0 1 1 50 36.5Z"/></g><path class="pages" fill="#f1e3c8" d="M48.4 70C42 58 26 56 10 62V78C26 72 42 74 48.4 86ZM51.6 70C58 58 74 56 90 62V78C74 72 58 74 51.6 86Z"/></g>
</svg>
