<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14110f">
<title>Ebook spike (#131)</title>
<style>
  body { font: 14px/1.35 system-ui, sans-serif; margin: 0; padding: 8px; background: #14110f; color: #eee; }
  h1 { font-size: 16px; margin: 4px 0 8px; }
  button { font: inherit; padding: 10px 12px; margin: 3px 3px 3px 0; border-radius: 8px; border: 1px solid #777; background: #2a2420; color: #fff; min-height: 44px; }
  label.file { display: inline-block; padding: 10px 12px; border: 1px solid #777; border-radius: 8px; margin: 3px 3px 3px 0; min-height: 24px; }
  pre { white-space: pre-wrap; word-break: break-all; font: 11px/1.3 ui-monospace, monospace; background: #000; padding: 6px; border-radius: 6px; max-height: 55vh; overflow: auto; }
  #mode { color: #f90; }
</style>
</head>
<body>
<h1>Ebook spike #131 · <span id="mode"></span></h1>
<div>
  <button data-testid="env">1 env</button>
  <button data-testid="pickDir">1 pick folder</button>
  <button data-testid="scan">1/3 scan</button>
  <button data-testid="read">1 read 1st</button>
  <button data-testid="perm">2 query perm</button>
  <button data-testid="req">2 request perm</button>
  <button data-testid="meta">7 metadata</button>
  <button data-testid="opfs">6 OPFS</button>
  <button data-testid="pickFiles">5 showOpenFilePicker</button>
  <label class="file">5 input file <input type="file" accept=".epub" multiple data-testid="input" hidden></label>
  <button data-testid="share">4 shared</button>
  <button data-testid="clear">clear</button>
</div>
<form method="POST" action="/share" enctype="multipart/form-data" style="margin:6px 0">
  <b>4 share simulation</b> (same multipart POST the share sheet makes):
  <input type="file" name="ebooks" multiple accept=".epub,application/epub+zip" data-testid="shareFiles">
  <button type="submit" data-testid="sharePost">POST files to /share</button>
</form>
<form method="POST" action="/share" enctype="multipart/form-data" style="margin:6px 0">
  <input type="hidden" name="title" value="A Book"><input type="hidden" name="text" value="look at this"><input type="hidden" name="url" value="https://example.org/book/9780141439518">
  <button type="submit" data-testid="shareTextPost">POST text/url only to /share</button>
</form>
<pre id="out" data-testid="out"></pre>
<script type="module" src="/app.js"></script>
</body>
</html>
