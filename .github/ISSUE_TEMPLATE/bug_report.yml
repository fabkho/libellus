name: Bug report
description: Something in Libellus does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, iOS 18, installed from the home screen
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Running it locally
        - The owner's instance
