# Dependabot version updates (security updates are a repository setting, docs/security/repository-hardening.md).
# Weekly, one grouped pull request per ecosystem for minor and patch updates; majors come as their own
# pull requests. Dependabot's pull requests get no secrets, which the workflows tolerate (ci.yml).
# The github-actions ecosystem keeps the full-commit-SHA pins of the workflows current: it reads the
# `# vX` comment after each pin and bumps both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /design
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      design-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
