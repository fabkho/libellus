name: Package bumps

# Weekly: when fabkho/ui or fabkho/chat publishes a release newer than the tag web/package.json pins for
# @fabkho/ui or @fabkho/chat, open the bump pull request (.github/scripts/ui-bump.sh; docs/DEVELOPMENT.md,
# "The package bumps"). One job and one pull request per package: they release independently, and a bad
# release of one must not hold the other up (fail-fast is off). Nothing newer, nothing opened. No secret:
# GITHUB_TOKEN opens the pull request, and the job dispatches the checks of ci.yml on its branch (flows=false), because a pull request made with GITHUB_TOKEN starts no workflow
# (workflow_dispatch is the one exception). Nothing is billed for this public repository's hosted runners
# beyond the job itself, which takes about a minute, and nothing runs in weeks without a release.
on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC
  workflow_dispatch:

concurrency:
  group: package-bumps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: open the @fabkho/${{ matrix.package }} bump
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [ui, chat]
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Open the bump pull request if fabkho/${{ matrix.package }} has a newer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ui-bump.sh ${{ matrix.package }}
