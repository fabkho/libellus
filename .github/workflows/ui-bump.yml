name: UI base bump

# Weekly: when fabkho/ui publishes a release newer than the tag web/package.json pins, open the bump
# pull request (.github/scripts/ui-bump.sh; docs/DEVELOPMENT.md, "The UI base bump"). Nothing newer,
# nothing opened. No secret: GITHUB_TOKEN opens the pull request, and the job dispatches the checks of
# ci.yml on its branch (flows=false), because a pull request made with GITHUB_TOKEN starts no workflow
# (workflow_dispatch is the one exception). Nothing is billed for this public repository's hosted runners
# beyond the job itself, which takes about a minute, and nothing runs in weeks without a release.
on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC
  workflow_dispatch:

concurrency:
  group: ui-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: open the @fabkho/ui bump
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Open the bump pull request if fabkho/ui has a newer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ui-bump.sh
