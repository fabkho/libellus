name: Release

# Versioned releases (docs/OPERATIONS.md, "Releases"). Merging into `main` changes
# nothing that members see; a release does:
#
#   1. release-please (every push to main) keeps one pull request open,
#      "chore(main): release x.y.z", with CHANGELOG.md and version.txt written from
#      the conventional commits merged since the last release.
#   2. The owner merges that pull request. The push it makes runs release-please
#      again, which tags vX.Y.Z and creates the GitHub release.
#   3. `flows` (same run) runs every user flow, @full included, against the tagged
#      commit on a local stack (e2e.yml, one shard, about 20 billed minutes). They
#      run nowhere else on the way to a release: not on pull requests and not on
#      pushes to main (docs/TESTING.md, "CI: what runs when"). The release pull
#      request cannot run them: a pull request release-please opens with the run's
#      own token starts no workflow. Red, and the release stops with nothing shipped.
#   4. `deploy` (same run, in the `production` environment) then pushes the
#      database migrations, deploys every edge function and moves the branch
#      `production` to the tag. Cloudflare Pages builds `production` as the live
#      site (docs/HOSTING.md), so the web app follows last, on a backend that
#      already has what it needs.
#
# Why one workflow and not `on: release`: a release created with the run's own
# GITHUB_TOKEN starts no other workflow, so a second workflow would never hear
# of it. The deploy job runs in the same run instead, right after the release.
#
# Run it by hand (Actions → Release → Run workflow, from `main`, or
# `gh workflow run release.yml -f tag=v1.2.3`) to deploy an existing tag again:
# a retry after a failure, or a rollback to an older release (then with
# `migrations` off: migrations only go forward, see docs/OPERATIONS.md). A rollback
# runs no flows (the older release shipped with them); a manual run with `migrations`
# on runs them, unless `skip_flows` is on: `gh workflow run release.yml -f tag=v1.2.3
# -f skip_flows=true` deploys without waiting for them.
#
# Never on pull requests: every job checks the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, e.g. v1.2.3'
        required: true
        type: string
      migrations:
        description: 'Push the database migrations first (turn off for a rollback to an older release)'
        required: true
        type: boolean
        default: true
      skip_flows:
        description: 'Deploy without running the user flows first (they take about 20 minutes)'
        required: false
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  release-please:
    name: release pull request and tag
    if: github.event_name == 'push' && github.repository == 'fabkho/libellus'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time and never cancelled: a run cut off between creating the release
    # and handing it to `deploy` would leave a release that nothing deployed.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write # the release commit's tag and the GitHub release
      pull-requests: write # the release pull request
      issues: write # its `autorelease: pending` / `tagged` labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please-config.json and .release-please-manifest.json say what to release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release

  # Every user flow before anything goes out: red, and the release stops with the
  # migrations, the functions and the branch `production` untouched. The steps are
  # e2e.yml's, shared with ci.yml (`full-e2e` label, manual run); the tagged commit is
  # what runs. Forward releases only: a rollback (a manual run with `migrations` off,
  # for a tag that already shipped) pays nothing for them and is not held up by a
  # flow failing on an older release. `skip_flows` skips them on a manual run.
  flows:
    name: user flows of ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    needs: release-please
    # `release-please` is skipped on a manual run; !cancelled() lets this job run anyway.
    if: >-
      ${{ !cancelled() && github.repository == 'fabkho/libellus' && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.migrations && !inputs.skip_flows)
      ) }}
    permissions:
      contents: read # a called workflow's permissions only narrow its caller's
    uses: ./.github/workflows/e2e.yml
    with:
      ref: refs/tags/${{ inputs.tag || needs.release-please.outputs.tag_name }}
      # One shard: each one pays its own setup (stack, browsers, build) on a two-core
      # runner, so four cost more billed minutes than one, which is slower to finish.
      shards: '[1]'
    secrets: inherit

  deploy:
    name: deploy ${{ inputs.tag || needs.release-please.outputs.tag_name }} to production
    needs: [release-please, flows]
    # `release-please` and `flows` are skipped on a manual run; !cancelled() lets this
    # job run anyway. It runs when the flows passed, or when they were left out on
    # purpose: a manual run with `migrations` off (a rollback) or with `skip_flows` on.
    # A failed or cancelled flows job stops the release here, before anything changed.
    if: >-
      ${{ !cancelled() && github.repository == 'fabkho/libellus' && (
        needs.flows.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && (!inputs.migrations || inputs.skip_flows))
      ) && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment's secrets are readable by this job only (docs/OPERATIONS.md,
    # "Releases": what to set up). Its deployment branch rule should allow `main` only.
    environment:
      name: production
      url: https://libellus.fabkho.dev
    # One deploy at a time; a newer one waiting replaces an older one waiting.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # The run's own token only reads. The branch `production` is moved with the
    # environment's deploy key: GitHub refuses a GITHUB_TOKEN push that brings
    # changed workflow files to a branch, and most releases do.
    permissions:
      contents: read
    env:
      SUPABASE_CLI: 2.118.0 # pinned like ci.yml
      EVENT: ${{ github.event_name }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_MIGRATIONS: ${{ inputs.migrations }}
      RELEASED_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Which release
        id: which
        env:
          HAS_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY != '' }}
          HAS_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"; migrations="$INPUT_MIGRATIONS"
          else
            tag="$RELEASED_TAG"; migrations=true
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a release tag (vX.Y.Z)."
            exit 1
          fi
          missing=()
          [ "$HAS_DEPLOY_KEY" = true ] || missing+=('secret PRODUCTION_DEPLOY_KEY')
          [ "$HAS_ACCESS_TOKEN" = true ] || missing+=('secret SUPABASE_ACCESS_TOKEN')
          [ -n "$PROJECT_REF" ] || missing+=('variable SUPABASE_PROJECT_REF')
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The environment 'production' lacks: ${missing[*]} (docs/OPERATIONS.md, \"Releases\")."
            exit 1
          fi
          echo "Deploying $tag (migrations: $migrations)"
          { echo "tag=$tag"; echo "migrations=$migrations"; } >> "$GITHUB_OUTPUT"

      # The whole history (cheap: a few thousand commits) so the tag can be checked
      # against `main` and `production`. The deploy key is kept for the push below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.which.outputs.tag }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      # Before anything is deployed: the tag must be on `main`, and `production`
      # may only go forward, unless this is a manual run (a rollback).
      - name: Check the tag against main and production
        id: branch
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          set -euo pipefail
          target="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$target" origin/main; then
            echo "::error::$TAG ($target) is not on main."
            exit 1
          fi
          current="$(git rev-parse -q --verify 'refs/remotes/origin/production^{commit}' || true)"
          if [ -z "$current" ]; then
            move=create
          elif [ "$current" = "$target" ]; then
            move=none
          elif git merge-base --is-ancestor "$current" "$target"; then
            move=forward
          elif [ "$EVENT" = workflow_dispatch ]; then
            move=rollback
          else
            echo "::error::production ($current) has commits $TAG does not; only a manual run may move it back."
            exit 1
          fi
          echo "production: ${current:-none} → $target ($move)"
          { echo "target=$target"; echo "current=$current"; echo "move=$move"; } >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: ${{ env.SUPABASE_CLI }}

      # Only the access token is needed: the CLI logs in to the database with a
      # temporary role it creates through the Management API, over the IPv4 pooler
      # (runners have no IPv6). The secret SUPABASE_DB_PASSWORD is optional; when it
      # is set the CLI uses it instead (exported only then: an empty one would be tried).
      - name: Link the hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"

      # Fails here, before anything changed, when the database has a migration the tag
      # does not (an older tag: run it with migrations off) or one cannot be read.
      - name: Migrations (dry run)
        id: dryrun
        if: steps.which.outputs.migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [ -z "$DB_PASSWORD" ] || export SUPABASE_DB_PASSWORD="$DB_PASSWORD"
          supabase db push --linked --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/db-dry-run.txt"

      - name: Migrations
        id: migrate
        if: steps.which.outputs.migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [ -z "$DB_PASSWORD" ] || export SUPABASE_DB_PASSWORD="$DB_PASSWORD"
          supabase db push --linked --include-all --yes

      # Every function under supabase/functions (not `_shared`-style folders), each
      # with its own settings from config.toml ([functions.<name>]: verify_jwt,
      # entrypoint, import_map, static_files). Bundled by the API, no Docker. The
      # functions' secrets (`supabase secrets set`) stay as they are.
      - name: Edge functions
        id: functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          deployed=()
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in _*|.*) continue ;; esac
            echo "::group::$name"
            supabase functions deploy "$name" --use-api
            echo "::endgroup::"
            deployed+=("$name")
          done
          echo "names=${deployed[*]}" >> "$GITHUB_OUTPUT"

      # Last: Cloudflare Pages builds the branch `production` as the live site.
      - name: Move production to the tag
        id: move
        env:
          TAG: ${{ steps.which.outputs.tag }}
          TARGET: ${{ steps.branch.outputs.target }}
          CURRENT: ${{ steps.branch.outputs.current }}
          MOVE: ${{ steps.branch.outputs.move }}
        run: |
          set -euo pipefail
          case "$MOVE" in
            none) echo "production is already at $TAG." ;;
            create | forward) git push origin "$TARGET:refs/heads/production" ;;
            rollback) git push --force-with-lease="refs/heads/production:$CURRENT" origin "$TARGET:refs/heads/production" ;;
          esac

      - name: Summary
        if: ${{ !cancelled() && steps.which.outcome == 'success' }}
        env:
          TAG: ${{ steps.which.outputs.tag }}
          MIGRATIONS: ${{ steps.which.outputs.migrations }}
          MIGRATE: ${{ steps.migrate.outcome }}
          FUNCTIONS: ${{ steps.functions.outputs.names }}
          FUNCTIONS_OUTCOME: ${{ steps.functions.outcome }}
          TARGET: ${{ steps.branch.outputs.target }}
          MOVE: ${{ steps.branch.outputs.move }}
          MOVED: ${{ steps.move.outcome }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2016 # the backticks are Markdown
          list() { sed '/^$/d; s/^/- `/; s/$/`/'; }
          {
            echo "## $TAG"
            echo
            echo "[Release notes]($REPO/releases/tag/$TAG)"
            echo
            echo "### Migrations"
            if [ "$MIGRATIONS" != true ]; then
              echo 'Skipped: a manual run with migrations off.'
            elif [ "$MIGRATE" != success ]; then
              echo "Not applied (${MIGRATE:-not reached}); see the log. Pending, per the dry run:"
              { grep -oE '[0-9]{14}_[A-Za-z0-9_.-]+[.]sql' "$RUNNER_TEMP/db-dry-run.txt" 2>/dev/null || true; } | sort -u | list
            else
              applied="$({ grep -oE '[0-9]{14}_[A-Za-z0-9_.-]+[.]sql' "$RUNNER_TEMP/db-dry-run.txt" 2>/dev/null || true; } | sort -u)"
              if [ -n "$applied" ]; then list <<< "$applied"; else echo 'None: the database was up to date.'; fi
            fi
            echo
            echo "### Edge functions"
            if [ "$FUNCTIONS_OUTCOME" = success ]; then tr ' ' '\n' <<< "$FUNCTIONS" | list
            else echo "Not deployed (${FUNCTIONS_OUTCOME:-not reached}); see the log."; fi
            echo
            echo "### Web app"
            if [ "$MOVED" = success ]; then
              echo "Branch \`production\` is at \`${TARGET:0:7}\` ($MOVE). Cloudflare Pages builds it now: its check on"
              echo "[the commit]($REPO/commit/$TARGET) links the deployment (also Workers & Pages → libellus → Deployments)."
              echo "Live at https://libellus.fabkho.dev once the build is done."
            else
              echo "Branch \`production\` not moved (${MOVED:-not reached}): the live site is unchanged."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
