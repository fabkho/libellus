name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: database rules (pgTAP) and web data layer (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned: "latest" resolves via the GitHub API and gets rate-limited; matches local

      # Same major as local. Build scripts pnpm may run (esbuild) are approved in
      # web/pnpm-workspace.yaml, so a frozen install passes on pnpm 11+.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Migrations and seed apply on start; the runner's Docker is what the
      # local stack runs on too. Ports come from supabase/config.toml (553xx).
      - name: Start Supabase
        run: supabase start

      - name: Database rules (pgTAP)
        run: supabase test db

      - name: Install web
        working-directory: web
        run: pnpm install --frozen-lockfile

      # The suite asks `supabase status` itself when these are unset; setting them
      # here keeps the CI run explicit about which stack it talks to.
      - name: Point the suite at the stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "MAILPIT_URL=${MAILPIT_URL:-$INBUCKET_URL}"
          } >> "$GITHUB_ENV"

      - name: Web data layer (Vitest against the local stack)
        working-directory: web
        run: pnpm test

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # The goodreads-rating edge function (#69): its parsing, matching, cache and
  # rate limit, on recorded Goodreads answers (no request leaves the runner).
  goodreads-function:
    name: goodreads-rating function (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint, check and test
        working-directory: supabase/functions/goodreads-rating
        run: deno lint && deno check *.ts && deno test --allow-read=.

  # The regal-export edge function (#110): the owner's Regal library file, on a
  # synthetic Library and published file (nothing leaves the runner). It imports
  # the export modules from web/app/data/export, so this also checks they stay
  # runnable by Deno.
  regal-export-function:
    name: regal-export function (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint, check and test
        working-directory: supabase/functions/regal-export
        run: deno lint && deno check *.ts && deno task test

  web-build:
    name: web builds (nuxt generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Service worker and manifest are emitted
        working-directory: web
        run: test -f .output/public/sw.js && test -f .output/public/manifest.webmanifest

  tokens:
    name: design tokens are generated, not hand-edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml

      - name: Generated files match tokens.json
        working-directory: design
        run: pnpm install --frozen-lockfile && pnpm tokens:check

  # The user flows (web/e2e): Playwright in WebKit at iPhone size, against the
  # local stack. Its own job, so a slow browser never holds up the database job
  # and a red flow is told apart from a red rule. Apple and OpenLibrary answer
  # from the recordings (web/e2e/support.ts); the fixture in web/e2e/fixtures.ts
  # fails any test that reaches another host.
  #
  # Three shards (Playwright's --shard i/3), each on its own runner with its own
  # fresh stack and the same two workers and one retry as before, so a pull
  # request waits for a third of the flows. The shards are independent: every flow
  # makes its own member and tags what it creates (web/tests/support/stack.ts), and
  # none depends on the order or the neighbours of another (#72). A shard that
  # fails uploads its blob report; e2e-report merges them into one HTML report.
  e2e:
    name: user flows (Playwright, WebKit, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned like the database job, and matches local

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Only what the flows use: the database, auth, the API, the mail catcher
      # (the sign-in code is read out of it) and storage. Migrations and seed
      # (the dev invite) apply on start, onto an empty database.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta

      - name: Install web
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Point the suite at the stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "MAILPIT_URL=${MAILPIT_URL:-$INBUCKET_URL}"
          } >> "$GITHUB_ENV"

      # The browser download is cached per Playwright version; the system
      # libraries it needs live outside that folder, so they are installed
      # either way.
      - name: Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # WebKit for the flows; Chromium for e2e/offline.spec.ts, whose offline
      # reload WebKit's driver cannot serve from a route.
      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit, Chromium and their system libraries
        working-directory: web
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps webkit chromium
          else
            pnpm exec playwright install --with-deps webkit chromium
          fi

      - name: User flows
        working-directory: web
        run: pnpm e2e --shard=${{ matrix.shard }}/3

      # The blob report holds the results, screenshots and traces of this shard.
      - name: Upload the blob report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 1

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # One combined report for the three shards, only when one of them failed.
  e2e-report:
    name: user flows report (merged)
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web
        working-directory: web
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          path: web/all-blob-reports
          pattern: playwright-blob-*
          merge-multiple: true

      - name: Merge into one HTML report
        working-directory: web
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload the report and traces
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
