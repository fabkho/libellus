name: CI

# What runs when (also in docs/TESTING.md, "CI: what runs when"). The private
# account has a fixed pool of Actions minutes, so the workflow spends them
# where they buy something:
#
#   pull request      the checks the changed paths call for, Playwright included
#   push to main      the cheap checks only (the merged pull request already ran
#                     the flows): database rules + Vitest, builds, tokens, Deno
#   workflow_dispatch everything, Playwright included (a manual full run)
#
# Docs-only changes (*.md, docs/**, android/**) start no run at all. A new push
# to a pull request cancels the run still going for it.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'android/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'android/**'
      - 'LICENSE'
  workflow_dispatch:

# One run per pull request: a push, a force-pushed rebase or a re-run cancels
# the one before it. A run on main (or a manual one) has its own group per
# commit, so it is never cancelled or dropped by the next merge and every
# commit on main keeps a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Playwright shards on a pull request: 2 is the trade-off measured in
  # docs/TESTING.md (CI: what runs when). The repository variable E2E_SHARDS
  # overrides it without a commit; 1 is the cheapest in minutes.
  DEFAULT_E2E_SHARDS: 2

jobs:
  # Decides from the changed paths which jobs run. A skipped job is a pass for
  # everything downstream; nothing here is a required check.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of a pull request through the API
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      e2e: ${{ steps.decide.outputs.e2e }}
      shards: ${{ steps.decide.outputs.shards }}
      statics: ${{ steps.decide.outputs.statics }}
      web: ${{ steps.decide.outputs.web }}
      tokens: ${{ steps.decide.outputs.tokens }}
      goodreads: ${{ steps.decide.outputs.goodreads }}
      regal: ${{ steps.decide.outputs.regal }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'

      # Every filter lists the workflow files: changing CI runs what CI does.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            ci: &ci
              - '.github/**'
            stack: &stack
              - *ci
              - 'web/**'
              - 'supabase/migrations/**'
              - 'supabase/seed.sql'
              - 'supabase/config.toml'
            backend:
              - *stack
              - 'supabase/tests/**'
              - 'supabase/templates/**'
            web:
              - *ci
              - 'web/**'
            tokens:
              - *ci
              - 'design/**'
              - 'web/app/assets/css/tokens.generated.css'
            goodreads:
              - *ci
              - 'supabase/functions/goodreads-rating/**'
            regal:
              - *ci
              - 'supabase/functions/regal-export/**'
              - 'web/app/data/export/**'

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FILTER_STACK: ${{ steps.filter.outputs.stack }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_TOKENS: ${{ steps.filter.outputs.tokens }}
          FILTER_GOODREADS: ${{ steps.filter.outputs.goodreads }}
          FILTER_REGAL: ${{ steps.filter.outputs.regal }}
          INPUT_SHARDS: ${{ vars.E2E_SHARDS || env.DEFAULT_E2E_SHARDS }}
        run: |
          all=false
          [ "$EVENT" = workflow_dispatch ] && all=true
          on() { if [ "$all" = true ] || [ "$1" = true ]; then echo true; else echo false; fi; }

          backend=$(on "$FILTER_BACKEND")
          web=$(on "$FILTER_WEB")
          tokens=$(on "$FILTER_TOKENS")
          goodreads=$(on "$FILTER_GOODREADS")
          regal=$(on "$FILTER_REGAL")
          # Playwright: never on a push to main, only when the app or the schema it runs on changed.
          e2e=false
          if [ "$EVENT" != push ]; then e2e=$(on "$FILTER_STACK"); fi

          # One stack job per shard; shard 1 also runs pgTAP and Vitest. With no
          # flows to run, the stack job is a single backend-only job.
          shards='[]'
          if [ "$e2e" = true ]; then
            shards=$(seq -s, 1 "$INPUT_SHARDS" | sed 's/^/[/; s/$/]/')
          elif [ "$backend" = true ]; then
            shards='[1]'
          fi

          statics=false
          for v in "$web" "$tokens" "$goodreads" "$regal"; do [ "$v" = true ] && statics=true; done

          {
            echo "backend=$backend"; echo "e2e=$e2e"; echo "shards=$shards"
            echo "statics=$statics"; echo "web=$web"; echo "tokens=$tokens"
            echo "goodreads=$goodreads"; echo "regal=$regal"
          } | tee -a "$GITHUB_OUTPUT"

  # Database rules (pgTAP), the web data layer (Vitest) and the user flows
  # (web/e2e: Playwright in WebKit at iPhone size) on one local stack per
  # runner, so the Supabase pull, boot and install is paid once per job and
  # never twice for the same runner. Shard 1 runs pgTAP and Vitest first (cheap,
  # and a red rule says so before ten minutes of flows); every shard then runs
  # its slice of the flows (`--shard i/N`, split by test, not by file). On a
  # push to main only shard 1 exists and stops after Vitest.
  #
  # Apple and OpenLibrary answer from the recordings (web/e2e/support.ts); the
  # fixture in web/e2e/fixtures.ts fails any test that reaches another host.
  # The shards are independent: every flow makes its own member and tags what it
  # creates (web/tests/support/stack.ts). A failed shard uploads its blob report;
  # e2e-report merges them into one HTML report.
  stack:
    name: >-
      ${{ needs.changes.outputs.e2e == 'true' && format('rules, data layer and user flows (shard {0}/{1})', matrix.shard, strategy.job-total)
      || 'database rules (pgTAP) and web data layer (Vitest)' }}
    needs: changes
    if: ${{ needs.changes.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    env:
      SUPABASE_CLI: 2.118.0 # pinned: "latest" resolves via the GitHub API and gets rate-limited; matches local
      RUN_BACKEND: ${{ matrix.shard == 1 && needs.changes.outputs.backend == 'true' }}
      RUN_E2E: ${{ needs.changes.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}

      # Same major as local. Build scripts pnpm may run (esbuild) are approved in
      # web/pnpm-workspace.yaml, so a frozen install passes on pnpm 11+.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # cache: pnpm keeps the pnpm store between runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Only what the flows and the data layer use: the database, auth, the API,
      # the mail catcher (the sign-in code is read out of it) and storage.
      # Migrations and seed (the dev invite) apply on start, onto an empty
      # database. Ports come from supabase/config.toml (553xx).
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta

      - name: Database rules (pgTAP)
        if: env.RUN_BACKEND == 'true'
        run: supabase test db

      - name: Install web
        working-directory: web
        run: pnpm install --frozen-lockfile

      # The suites ask `supabase status` themselves when these are unset; setting
      # them keeps the run explicit about which stack it talks to.
      - name: Point the suite at the stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "MAILPIT_URL=${MAILPIT_URL:-$INBUCKET_URL}"
          } >> "$GITHUB_ENV"

      - name: Web data layer (Vitest against the local stack)
        if: env.RUN_BACKEND == 'true'
        working-directory: web
        run: pnpm test

      # The browser download is cached per Playwright version; the system
      # libraries it needs live outside that folder, so they are installed
      # either way.
      - name: Playwright version
        if: env.RUN_E2E == 'true'
        id: playwright
        working-directory: web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # WebKit for the flows; Chromium for e2e/offline.spec.ts, whose offline
      # reload WebKit's driver cannot serve from a route.
      - name: Cache the browsers
        if: env.RUN_E2E == 'true'
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit, Chromium and their system libraries
        if: env.RUN_E2E == 'true'
        working-directory: web
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps webkit chromium
          else
            pnpm exec playwright install --with-deps webkit chromium
          fi

      - name: User flows
        if: env.RUN_E2E == 'true'
        working-directory: web
        run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The blob report holds the results, screenshots and traces of this shard.
      - name: Upload the blob report
        if: failure() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 1
          if-no-files-found: ignore

  # One combined report for the shards, only when one of them failed. A job
  # that failed before any flow ran has no blob report; then there is nothing to merge.
  e2e-report:
    name: user flows report (merged)
    needs: stack
    if: ${{ !cancelled() && needs.stack.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web
        working-directory: web
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: web/all-blob-reports
          pattern: playwright-blob-*
          merge-multiple: true

      - name: Merge into one HTML report
        if: hashFiles('web/all-blob-reports/*') != ''
        working-directory: web
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload the report and traces
        if: hashFiles('web/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  # The checks that take seconds each, in one job so the minutes are not rounded
  # up four times: the design tokens, the web build, and the two edge functions
  # (their Deno tests run on recorded answers, no request leaves the runner).
  # Each step runs when its paths changed, even if an earlier one failed.
  statics:
    name: tokens, web build and edge functions
    needs: changes
    if: ${{ needs.changes.outputs.statics == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.tokens == 'true'
        with:
          version: 12

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.tokens == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            design/pnpm-lock.yaml

      - name: Design tokens are generated, not hand-edited
        if: ${{ !cancelled() && needs.changes.outputs.tokens == 'true' }}
        working-directory: design
        run: pnpm install --frozen-lockfile && pnpm tokens:check

      - name: Web builds (nuxt generate)
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Service worker and manifest are emitted
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
        working-directory: web
        run: test -f .output/public/sw.js && test -f .output/public/manifest.webmanifest

      - uses: denoland/setup-deno@v2
        if: needs.changes.outputs.goodreads == 'true' || needs.changes.outputs.regal == 'true'
        with:
          deno-version: v2.x

      # The goodreads-rating edge function (#69): its parsing, matching, cache and
      # rate limit, on recorded Goodreads answers.
      - name: goodreads-rating function (Deno lint, check, test)
        if: ${{ !cancelled() && needs.changes.outputs.goodreads == 'true' }}
        working-directory: supabase/functions/goodreads-rating
        run: deno lint && deno check *.ts && deno test --allow-read=.

      # The regal-export edge function (#110): the owner's Regal library file, on a
      # synthetic Library and published file. It imports the export modules from
      # web/app/data/export, so this also checks they stay runnable by Deno.
      - name: regal-export function (Deno lint, check, test)
        if: ${{ !cancelled() && needs.changes.outputs.regal == 'true' }}
        working-directory: supabase/functions/regal-export
        run: deno lint && deno check *.ts && deno task test
