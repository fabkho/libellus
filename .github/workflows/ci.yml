name: CI

# What runs when (also in docs/TESTING.md, "CI: what runs when"):
#
#   pull request      the checks the changed paths call for. No user flows: the
#                     flows are where the minutes go
#   PR label full-e2e the same checks, and every flow, @full included (adding the
#                     label starts the run; the run of every later push keeps it)
#   push to main      the checks the changed paths call for, and no flows: the
#                     flows run once per release, in the release's own run, before
#                     anything is deployed (release.yml, `flows`)
#   workflow_dispatch everything, every flow (a manual full run)
#
# The flows are the one reusable workflow e2e.yml, called from here and from
# release.yml. They are ~20 runner minutes on the two-core
# runners, which is why only a release (and a label or a manual run) pays them.
#
# Docs-only changes (*.md, docs/**, android/**) start no run at all, and neither
# does a release pull request ("chore(main): release x.y.z", release.yml): it only
# changes CHANGELOG.md, version.txt and the release manifest. A new push to a pull
# request cancels the run still going for it.
on:
  pull_request:
    # `labeled`: adding full-e2e starts a full run (any other label starts nothing, see `changes`).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'android/**'
      - 'LICENSE'
      - 'version.txt'
      - '.release-please-manifest.json'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'android/**'
      - 'LICENSE'
      - 'version.txt'
      - '.release-please-manifest.json'
  workflow_dispatch:

# One run per pull request: a push, a force-pushed rebase or a re-run cancels
# the one before it. A run on main (or a manual one) has its own group per
# commit, so it is never cancelled or dropped by the next merge and every
# commit on main keeps a result. A label other than full-e2e gets a group of its
# own, so labelling a pull request never cancels its run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-e2e' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The owner's builds extend Regal (her shelf, #23; web/regal.config.ts), a Nuxt layer that
  # Nuxt downloads from fabkho/regal when LIBELLUS_REGAL=1. The repository is public, so the
  # run's own read-only token is all the download needs (web/regal.config.ts asks for a token):
  # no account-wide secret reaches a pull request's jobs (docs/security/final-round-2026-10.md,
  # F8). The statics job also builds without the layer, on purpose.
  GIGET_AUTH: ${{ github.token }}
  LIBELLUS_REGAL: '1'
  # Playwright shards of a `full-e2e` or manual run: 4, each about as long as the others
  # (web/e2e/shard.ts, from the durations CI measured), as weighed in docs/TESTING.md
  # ("How many shards"). The repository variable E2E_SHARDS overrides it without a commit.
  # A release runs one shard (release.yml).
  DEFAULT_E2E_SHARDS: 4

jobs:
  # Decides from the changed paths which jobs run. A skipped job is a pass for
  # everything downstream; nothing here is a required check.
  changes:
    name: what changed
    # A label other than full-e2e changes nothing to check.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of a pull request through the API
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      e2e: ${{ steps.decide.outputs.e2e }}
      shards: ${{ steps.decide.outputs.shards }}
      statics: ${{ steps.decide.outputs.statics }}
      web: ${{ steps.decide.outputs.web }}
      tokens: ${{ steps.decide.outputs.tokens }}
      goodreads: ${{ steps.decide.outputs.goodreads }}
      regal: ${{ steps.decide.outputs.regal }}
      og: ${{ steps.decide.outputs.og }}
      enrich: ${{ steps.decide.outputs.enrich }}
      invite: ${{ steps.decide.outputs.invite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'push'

      # Every filter lists the workflow files: changing CI runs what CI does.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            ci: &ci
              - '.github/**'
            stack: &stack
              - *ci
              - 'web/**'
              - 'supabase/migrations/**'
              - 'supabase/seed.sql'
              - 'supabase/config.toml'
            backend:
              - *stack
              - 'supabase/tests/**'
              - 'supabase/templates/**'
              - 'scripts/*backup*'
            web:
              - *ci
              - 'web/**'
            tokens:
              - *ci
              - 'design/**'
              - 'web/app/assets/css/tokens.generated.css'
              - 'supabase/templates/**'
              - 'supabase/functions/waitlist-invite/invite_mail.generated.mjs'
            goodreads:
              - *ci
              - 'supabase/functions/goodreads-rating/**'
            regal:
              - *ci
              - 'supabase/functions/regal-export/**'
              - 'web/app/data/export/**'
            og:
              - *ci
              - 'supabase/functions/reading-page-og/**'
            enrich:
              - *ci
              - 'supabase/functions/enrich/**'
              - 'web/app/data/enrich/genres.ts'
            invite:
              - *ci
              - 'supabase/functions/waitlist-invite/**'
              - 'design/emails/**'

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FULL_E2E_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-e2e') }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_TOKENS: ${{ steps.filter.outputs.tokens }}
          FILTER_GOODREADS: ${{ steps.filter.outputs.goodreads }}
          FILTER_REGAL: ${{ steps.filter.outputs.regal }}
          FILTER_OG: ${{ steps.filter.outputs.og }}
          FILTER_ENRICH: ${{ steps.filter.outputs.enrich }}
          FILTER_INVITE: ${{ steps.filter.outputs.invite }}
          INPUT_SHARDS: ${{ vars.E2E_SHARDS || env.DEFAULT_E2E_SHARDS }}
        run: |
          all=false
          if [ "$EVENT" = workflow_dispatch ]; then all=true; fi
          on() { if [ "$all" = true ] || [ "$1" = true ]; then echo true; else echo false; fi; }

          backend=$(on "$FILTER_BACKEND")
          web=$(on "$FILTER_WEB")
          tokens=$(on "$FILTER_TOKENS")
          goodreads=$(on "$FILTER_GOODREADS")
          regal=$(on "$FILTER_REGAL")
          og=$(on "$FILTER_OG")
          enrich=$(on "$FILTER_ENRICH")
          invite=$(on "$FILTER_INVITE")
          # Playwright: only by hand and on a pull request labelled `full-e2e` (docs/TESTING.md,
          # "CI: what runs when"). The flows are where the minutes go: a push to main does not
          # run them either, a release does (release.yml). Every flow, @full included.
          e2e=false
          if [ "$EVENT" = workflow_dispatch ]; then e2e=true; fi
          if [ "$EVENT" = pull_request ] && [ "$FULL_E2E_LABEL" = true ]; then e2e=true; fi

          # One e2e job per shard.
          shards=$(seq -s, 1 "$INPUT_SHARDS" | sed 's/^/[/; s/$/]/')

          statics=false
          for v in "$web" "$tokens" "$goodreads" "$regal" "$og" "$enrich" "$invite"; do [ "$v" = true ] && statics=true; done

          {
            echo "backend=$backend"; echo "e2e=$e2e"; echo "shards=$shards"
            echo "statics=$statics"; echo "web=$web"; echo "tokens=$tokens"
            echo "goodreads=$goodreads"; echo "regal=$regal"; echo "og=$og"; echo "enrich=$enrich"; echo "invite=$invite"
          } | tee -a "$GITHUB_OUTPUT"

  # Database rules (pgTAP), the web data layer (Vitest) and the backup round trip
  # on a local stack of their own, beside the flows rather than in front of them:
  # a red rule still says so within a few minutes, and no shard waits for it.
  #
  # Supabase starts in the background while pnpm installs (both are network
  # bound, neither needs the other); `Wait for Supabase` joins them. Only what
  # the suites use is started: the database, auth, the API, the mail catcher
  # (the sign-in code is read out of it) and storage. Migrations and seed (the
  # dev invite) apply on start, onto an empty database. Ports come from
  # supabase/config.toml (553xx).
  backend:
    name: database rules (pgTAP), data layer (Vitest) and backup
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CLI: 2.118.0 # pinned: "latest" resolves via the GitHub API and gets rate-limited; matches local
      # The stack's images come from GitHub's registry, not the CLI's default (public.ecr.aws),
      # which throttled parallel pulls ("toomanyrequests: Rate exceeded"). See docs/TESTING.md.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: ${{ env.SUPABASE_CLI }}

      - name: Start Supabase (in the background)
        run: scripts/ci-supabase.sh start

      # Same major as local. Build scripts pnpm may run (esbuild) are approved in
      # web/pnpm-workspace.yaml, so a frozen install passes on pnpm 11+.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      # cache: pnpm keeps the pnpm store between runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Wait for Supabase
        timeout-minutes: 8
        run: scripts/ci-supabase.sh wait

      - name: Database rules (pgTAP)
        run: supabase test db

      - name: Web data layer (Vitest against the local stack)
        working-directory: web
        run: pnpm test

      # The nightly backup's chain (.github/workflows/backup.yml) on what the suites
      # left in the stack: dump, age, restore into a scratch database both ways, rows
      # compared table by table. Catches a migration that would break a restore.
      - uses: ./.github/actions/postgres-client

      - name: Backup round trip (scripts/test-backup-roundtrip.sh)
        run: scripts/test-backup-roundtrip.sh

  # The user flows (web/e2e: Playwright in WebKit at iPhone size), whole jobs shared
  # with release.yml: .github/workflows/e2e.yml has the steps, the shard matrix and
  # the merged report. Here only for a pull request labelled `full-e2e` and a manual
  # run; a release runs them in its own run (release.yml, `flows`).
  e2e:
    name: user flows
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      shards: ${{ needs.changes.outputs.shards }}

  # The checks that take seconds each, in one job so the minutes are not rounded
  # up four times: the design tokens, the web build, and the two edge functions
  # (their Deno tests run on recorded answers, no request leaves the runner).
  # Each step runs when its paths changed, even if an earlier one failed.
  statics:
    name: tokens, web build and edge functions
    needs: changes
    if: ${{ needs.changes.outputs.statics == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.tokens == 'true'
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.tokens == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            design/pnpm-lock.yaml

      - name: Design tokens are generated, not hand-edited
        if: ${{ !cancelled() && needs.changes.outputs.tokens == 'true' }}
        working-directory: design
        run: pnpm install --frozen-lockfile && pnpm tokens:check

      - name: Email templates are generated, not hand-edited
        if: ${{ !cancelled() && needs.changes.outputs.tokens == 'true' }}
        working-directory: design
        run: pnpm install --frozen-lockfile && pnpm emails:check

      - name: Web builds (nuxt generate)
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
        working-directory: web
        env:
          # Any address does for the build: only the service worker's routes name it.
          NUXT_PUBLIC_REGAL_LIBRARY_SRC: ${{ vars.REGAL_LIBRARY_SRC || 'https://regal.example/v2/library.json' }}
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Service worker, manifest and Pages headers are emitted
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
        working-directory: web
        run: test -f .output/public/sw.js && test -f .output/public/manifest.webmanifest && grep -q '^/sw.js$' .output/public/_headers

      # Regal (three.js, the shelf's fonts) is fetched when the shelf opens, never precached (#23).
      - name: Regal is built apart and left out of the precache
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' && env.LIBELLUS_REGAL == '1' }}
        working-directory: web
        run: |
          ls .output/public/_nuxt/regal.*.js
          ! grep -oE '"(_nuxt/regal\.[^"]*|_fonts/[^"]*|models/[^"]*)"' .output/public/sw.js

      # The build without the Regal layer (docs/SETUP.md): no Regal, no GIGET_AUTH. It has to build, and
      # nothing of the shelf may be left in it. Pull requests only; the build is the cheap part.
      - name: Web builds without Regal (a fork's build)
        if: ${{ !cancelled() && needs.changes.outputs.web == 'true' && github.event_name != 'push' }}
        working-directory: web
        env:
          GIGET_AUTH: ''
          LIBELLUS_REGAL: ''
          REGAL_LAYER: ''
        run: |
          pnpm build
          test -f .output/public/sw.js && test -f .output/public/manifest.webmanifest
          ! ls .output/public/_nuxt/regal.*.js 2>/dev/null
          ! grep -q 'libellus-shelf' .output/public/sw.js

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: needs.changes.outputs.goodreads == 'true' || needs.changes.outputs.regal == 'true' || needs.changes.outputs.og == 'true' || needs.changes.outputs.enrich == 'true' || needs.changes.outputs.invite == 'true'
        with:
          deno-version: v2.x

      # The goodreads-rating edge function (#69): its parsing, matching, cache and
      # rate limit, on recorded Goodreads answers.
      - name: goodreads-rating function (Deno lint, check, test)
        if: ${{ !cancelled() && needs.changes.outputs.goodreads == 'true' }}
        working-directory: supabase/functions/goodreads-rating
        run: deno lint && deno check *.ts && deno test --allow-read=.

      # The regal-export edge function (#110): the owner's Regal library file, on a
      # synthetic Library and published file. It imports the export modules from
      # web/app/data/export, so this also checks they stay runnable by Deno.
      - name: regal-export function (Deno lint, check, test)
        if: ${{ !cancelled() && needs.changes.outputs.regal == 'true' }}
        working-directory: supabase/functions/regal-export
        run: deno lint && deno check *.ts && deno task test

      # The reading-page-og edge function (#171): the link-preview images of a
      # reading page and of a Book card, on fixtures of what the public database
      # functions return. Nothing is fetched: covers come from the stub.
      - name: reading-page-og function (Deno lint, check, test)
        if: ${{ !cancelled() && needs.changes.outputs.og == 'true' }}
        working-directory: supabase/functions/reading-page-og
        run: deno lint && deno check *.ts && deno task test

      # The enrich edge function (#166-#168): authors, series and genres from
      # recorded Wikidata, Open Library, Wikipedia, Commons and Apple answers. It
      # imports the genre mapping from web/app/data/enrich/genres.ts.
      - name: enrich function (Deno lint, check, test)
        if: ${{ !cancelled() && needs.changes.outputs.enrich == 'true' }}
        working-directory: supabase/functions/enrich
        run: deno lint && deno check *.ts && deno task test

      # The waitlist-invite edge function (#171): the owner's Invite, with a stand-in
      # database and mailer (mailed, not configured, a failed send, not the owner, a bad
      # body) and the mail's text. Nothing is sent and the SMTP client is never loaded.
      - name: waitlist-invite function (Deno lint, check, test)
        if: ${{ !cancelled() && needs.changes.outputs.invite == 'true' }}
        working-directory: supabase/functions/waitlist-invite
        run: deno lint && deno check *.ts && deno task test
