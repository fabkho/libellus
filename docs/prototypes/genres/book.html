<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Genres mock-up 1: the Book page's chips</title>
<link rel="stylesheet" href="base.css" />
<style>
  .glow { position: absolute; inset: -120px -80px auto; height: 560px; background: radial-gradient(closest-side, color-mix(in srgb, var(--color-cloth6) 55%, transparent), transparent); opacity: var(--opacity-glow); }
  [data-theme='light'] .glow { opacity: 0.35; }
  .hero { position: relative; display: flex; flex-direction: column; align-items: center; padding: 104px 20px 0; text-align: center; }
  .facts { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-ink-faint); margin-top: 8px; }
  .progress { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--color-ink-muted); }
  .bar { width: 120px; height: 2px; background: var(--color-hairline-strong); border-radius: 2px; } .bar i { display: block; width: 52%; height: 100%; background: var(--color-accent); }
  .primary { margin: 22px 20px 0; height: 50px; border-radius: 999px; background: var(--color-fill-strong); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; }
  .section { padding: 30px 20px 0; }
  .add { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; margin-top: 12px; font-size: 15px; color: var(--color-ink-muted); }
</style>
</head>
<body>
<div class="phone">
  <div class="glow"></div>
  <div class="status-bar"><span>9:41</span><span class="mono" style="font-size:12px;letter-spacing:2px">▪▪▪ ▮</span></div>
  <div class="round" style="left:20px"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></div>
  <div class="round" style="right:20px"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="18" cy="12" r=".8"/></svg></div>

  <div class="hero">
    <div class="cover xl c6"><span class="t">The Winter Pact</span><span class="a">Mara Ellis</span></div>
    <h1 class="serif headline" style="margin-top:26px">The Winter Pact</h1>
    <p class="body-large muted" style="margin-top:6px">Mara Ellis</p>
    <p class="facts" data-en="2024 · 412 pages" data-de="2024 · 412 Seiten"></p>
    <div class="progress"><span class="bar"><i></i></span><span class="mono" style="font-size:11px" data-en="p. 214 of 412" data-de="S. 214 von 412"></span></div>

    <!-- the chip row: the Book's labels (genre and sub-genre first, then audience, season, tropes, …), as many as fit in two lines,
         then hers (never folded away), then +N, then the quiet word that opens the sheet -->
    <ul class="chips" style="margin-top:16px; list-style:none; max-width:350px">
      <li class="chip" data-en="Romance" data-de="Liebesroman"></li>
      <li class="chip" data-en="New adult" data-de="New Adult"></li>
      <li class="chip" data-en="Christmas" data-de="Weihnachten"></li>
      <li class="chip" data-en="Enemies to lovers" data-de="Enemies to Lovers"></li>
      <li class="chip mine" data-en="Comfort read" data-de="Seelentröster"></li>
      <li class="chip more">+4</li>
      <li><button class="quiet-link" data-en="Edit" data-de="Bearbeiten"></button></li>
    </ul>
  </div>

  <div class="primary"><svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6"><path d="M7 4h10v16l-5-4-5 4z"/></svg><span data-en="Update progress" data-de="Fortschritt aktualisieren"></span></div>

  <div class="section">
    <h2 class="eyebrow" data-en="Collections" data-de="Sammlungen"></h2>
    <div class="add edge">＋ <span data-en="Add to collection" data-de="Zu Sammlung hinzufügen"></span></div>
  </div>
  <div class="section" style="padding-top:28px">
    <h2 class="eyebrow" data-en="Reading history" data-de="Leseverlauf"></h2>
  </div>

  <nav class="tabbar">
    <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
    <svg viewBox="0 0 24 24" style="color:var(--color-ink)"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15 5l3-1 3 15-3 1z"/></svg>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
  </nav>
</div>
<script src="mock.js"></script>
</body>
</html>
