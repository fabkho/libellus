<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Book notes 1: the Book page, Notes and Read together, and the quiet Notes from friends</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="room.css" />
<style>
  .hero { position: relative; display: flex; flex-direction: column; align-items: center; padding: 96px 20px 0; text-align: center; }
  .facts { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-ink-faint); margin-top: 8px; }
  .progress { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--color-ink-muted); }
  .bar { width: 120px; height: 2px; background: var(--color-hairline-strong); border-radius: 2px; } .bar i { display: block; width: 11%; height: 100%; background: var(--color-accent); }
  .actions { padding: 18px 20px 0; display: flex; flex-direction: column; gap: 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sec { padding: 22px 20px 0; }
  .frow { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 0 14px; }
  .frow .t { flex: 1; min-width: 0; } .frow .t b { display: block; font-weight: 500; font-size: 15px; }
  .frow .t span { display: block; font-size: 13px; color: var(--color-ink-faint); }
  .faces { display: flex; } .faces .av { width: 30px; height: 30px; font-size: 10px; margin-left: -8px; box-shadow: 0 0 0 2px var(--color-surface); } .faces .av:first-child { margin-left: 0; }
</style>
</head>
<body>
<div class="phone">
  <div class="glow"></div>
  <div class="status-bar"><span>9:41</span><span class="mono" style="font-size:12px;letter-spacing:2px">▪▪▪ ▮</span></div>
  <div class="round" style="left:20px"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></div>
  <div class="round" style="right:20px"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="18" cy="12" r=".8"/></svg></div>

  <div class="hero">
    <div class="cover xl c3" style="width:128px"><span class="t">The Salt Orchard</span><span class="a">Ilse Varga</span></div>
    <h1 class="serif headline" style="margin-top:22px">The Salt Orchard</h1>
    <p class="body-large muted" style="margin-top:6px">Ilse Varga</p>
    <p class="facts" data-en="2023 · 384 pages" data-de="2023 · 384 Seiten"></p>
    <div class="progress"><span class="bar"><i></i></span><span class="mono" style="font-size:11px" data-en="p. 41 of 384" data-de="S. 41 von 384"></span></div>
  </div>

  <div class="actions">
    <div class="btn quiet"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg><span data-en="Update progress" data-de="Fortschritt aktualisieren"></span></div>
    <div class="pair">
      <div class="btn quiet"><svg viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h4"/></svg><span data-en="Notes" data-de="Notizen"></span></div>
      <div class="btn quiet"><svg viewBox="0 0 24 24"><path d="M5 6h14v9H9l-4 3z"/></svg><span data-en="Read together" data-de="Gemeinsam lesen"></span></div>
    </div>
  </div>

  <div class="sec">
    <h2 class="eyebrow" style="margin-bottom:8px" data-en="Notes from friends" data-de="Notizen von Freunden"></h2>
    <div class="rowgroup">
      <div class="frow">
        <span class="faces"><span class="av photo2">B</span><span class="av">J</span></span>
        <span class="t"><b data-en="Ben and Jo" data-de="Ben und Jo"></b><span data-en="14 notes · chapters 1–9" data-de="14 Notizen · Kapitel 1–9"></span></span>
        <span class="chev">›</span>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
    <svg viewBox="0 0 24 24" style="color:var(--color-ink)"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15 5l3-1 3 15-3 1z"/></svg>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
  </nav>
</div>
<script src="mock.js"></script>
</body>
