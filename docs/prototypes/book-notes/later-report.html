<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Public book rooms 6: the report sheet for a public post</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="room.css" />
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span class="mono" style="font-size:12px;letter-spacing:2px">▪▪▪ ▮</span></div>
  <div class="scrim"></div>
  <section class="sheet" style="top:56px">
    <div class="grabber"></div>
    <div class="head">
      <button class="cancel" data-en="Cancel" data-de="Abbrechen"></button>
      <span class="title" data-en="Report post" data-de="Beitrag melden"></span>
      <button class="action" data-en="Send" data-de="Senden"></button>
    </div>
    <div class="body" style="padding-top:8px">
      <p class="caption muted" style="margin-bottom:12px" data-en="Mira K. won't know who reported it. I read every report, usually within a day." data-de="Mira K. erfährt nicht, wer gemeldet hat. Ich lese jede Meldung, meist innerhalb eines Tages."></p>
      <div class="rowgroup" role="radiogroup">
        <div class="radio" data-en="Spoiler without a mark" data-de="Spoiler ohne Markierung"></div>
        <div class="radio" data-en="Harassment or bullying" data-de="Belästigung oder Mobbing"></div>
        <div class="radio" data-en="Hate or threats" data-de="Hass oder Drohungen"></div>
        <div class="radio" data-en="Spam or advertising" data-de="Spam oder Werbung"></div>
        <div class="radio" data-en="Sexual content" data-de="Sexuelle Inhalte"></div>
        <div class="radio"><span data-en="I think it's against the law" data-de="Ich halte es für rechtswidrig"></span><span class="chk">✓</span></div>
        <div class="radio" data-en="Something else" data-de="Etwas anderes"></div>
      </div>
      <h3 class="eyebrow" style="margin:16px 0 8px" data-en="Why is it against the law? (needed)" data-de="Warum ist es rechtswidrig? (nötig)"></h3>
      <div class="textarea" data-en="Which law, and what in the post breaks it" data-de="Welches Gesetz, und was im Beitrag dagegen verstößt"></div>
      <div class="rowgroup" style="margin-top:12px">
        <div class="row"><span data-en="I report this in good faith" data-de="Ich melde das nach bestem Wissen"></span><span class="switch on"></span></div>
      </div>
      <p class="footnote faint" style="margin-top:10px" data-en="You'll hear back in the app what I decided." data-de="Du erfährst in der App, wie ich entschieden habe."></p>
    </div>
  </section>
</div>
<script src="mock.js"></script>
</body>
</html>
