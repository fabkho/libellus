<!doctype html>
<html>

<title>Book notes 3: the Notes page, the chapter list</title>
<link rel="stylesheet" href="base.css" />

<style>
  .hero { position: relative; display: flex; gap: 16px; align-items: flex-end; padding: 108px 20px 0; }

  .you { display: flex; align-items: center; justify-content: space-between; margin: 18px 20px 0; font-size: 13.5px; color: var(--color-ink-muted); }
  .you a { color: var(--color-accent-ink); font-weight: 500; }
  .rows { margin: 10px 16px 0; }
  .trow { min-height: 50px; }
  .fs { display: flex; } .fs .av { width: 22px; height: 22px; font-size: 8px; margin-left: -6px; box-shadow: 0 0 0 1.5px var(--color-surface); } .fs .av:first-child { margin-left: 0; }
  .eye { width: 16px; height: 16px; }
</style>
