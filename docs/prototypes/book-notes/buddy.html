<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Book notes 5: a buddy read = the Notes base plus what it adds</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="room.css" />
<style>
  .hero { position: relative; display: flex; gap: 16px; align-items: flex-end; padding: 108px 20px 0; }
  .hero h1 { font-size: 22px; line-height: 27px; }
  .private { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 2px 8px; border-radius: 999px; background: var(--color-fill-strong); font-size: 12px; color: var(--color-ink-muted); }
  .private .ico { width: 13px; height: 13px; }
  .track { position: relative; margin: 30px 28px 0; height: 2px; background: var(--color-hairline-strong); }
  .track i { position: absolute; top: -4px; width: 1px; height: 10px; background: var(--color-hairline-strong); }
  .track .av { position: absolute; top: -15px; width: 30px; height: 30px; font-size: 10px; transform: translateX(-50%); }
  .you { display: flex; align-items: center; justify-content: space-between; margin: 26px 20px 0; font-size: 13.5px; color: var(--color-ink-muted); }
  .you a { color: var(--color-accent-ink); font-weight: 500; }
  .rows { margin: 10px 16px 0; }
  .trow { min-height: 50px; }
  .eye { width: 16px; height: 16px; }
  .adds { outline: 1.5px dashed var(--color-accent); outline-offset: 4px; border-radius: 10px; }
  .tag { position: absolute; z-index: 20; padding: 3px 7px; border-radius: 6px; background: rgb(220 60 40 / 0.92); color: #fff; font: 500 10px/1.3 var(--font-mono); }
</style>
</head>
<body>
<div class="phone">
  <div class="glow"></div>
  <div class="status-bar"><span>9:41</span><span class="mono" style="font-size:12px;letter-spacing:2px">▪▪▪ ▮</span></div>
  <div class="round" style="left:20px"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></div>

  <div class="hero">
    <div class="cover md c3"><span class="t">The Salt Orchard</span><span class="a">Ilse Varga</span></div>
    <div>
      <p class="eyebrow" data-en="Buddy read" data-de="Buddy-Read"></p>
      <h1 class="serif" style="margin-top:6px">The Salt Orchard</h1>
      <p class="caption muted adds" style="margin-top:4px" data-en="with Ben and Mira" data-de="mit Ben und Mira"></p>
      <span class="private adds"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span data-en="Private · only the 3 of you" data-de="Privat · nur ihr 3"></span></span>
    </div>
  </div>

    <i style="left:12%"></i><i style="left:24%"></i><i style="left:36%"></i><i style="left:48%"></i><i style="left:60%"></i><i style="left:72%"></i><i style="left:84%"></i>
    <span class="av photo2" style="left:18%">B</span>
    <span class="av ring photo" style="left:42%">A</span>
    <span class="av" style="left:66%">M</span>
  </div>

  <div class="you">
    <span data-en="You: chapter 5 of 8" data-de="Du: Kapitel 5 von 8"></span>
    <a data-en="Where are you?" data-de="Wo bist du?"></a>
  </div>

  <div class="rowgroup rows">
    <div class="trow"><span class="n">–</span><span class="t" data-en="Before we start" data-de="Bevor wir anfangen"></span><span class="c">6</span><span class="chev">›</span></div>
    <div class="trow"><span class="n">1</span><span class="t" data-en="Chapters 1–5" data-de="Kapitel 1–5"></span><span class="c">12</span><span class="chev">›</span></div>
    <div class="trow"><span class="n">2</span><span class="t" data-en="Chapters 6–11" data-de="Kapitel 6–11"></span><span class="c">9</span><span class="dot"></span><span class="chev">›</span></div>
    <div class="trow veiled"><span class="n">3</span><span class="t"><svg class="ico eye" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6c1.6 0 3 .5 4.2 1.2M21 12s-3.5 6-9 6c-1.6 0-3-.5-4.2-1.2M4 4l16 16"/></svg></span><span class="c">4</span><span class="chev">›</span></div>
    <div class="trow veiled"><span class="n">4</span><span class="t"><svg class="ico eye" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6c1.6 0 3 .5 4.2 1.2M21 12s-3.5 6-9 6c-1.6 0-3-.5-4.2-1.2M4 4l16 16"/></svg></span><span class="c">0</span><span class="chev">›</span></div>

</div>
