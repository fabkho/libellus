<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Notes on a Book 5: the first open, Ben's side</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="room.css" />
<style>
  .under { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 100px; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span class="mono" style="font-size:12px;letter-spacing:2px">▪▪▪ ▮</span></div>
  <div class="under"><div class="cover xl c3"><span class="t">The Salt Orchard</span><span class="a">Ilse Varga</span></div></div>
  <div class="scrim"></div>
  <section class="sheet">
    <div class="grabber"></div>
    <div class="head"><button class="cancel" data-en="Not now" data-de="Nicht jetzt"></button><span class="title" data-en="Anna's notes" data-de="Annas Notizen"></span><span></span></div>
    <div class="body" style="padding-top:10px">
      <p class="serif callout" style="font-size:20px;line-height:26px" data-en="Anna left 14 notes on this book." data-de="Anna hat 14 Notizen zu diesem Buch hinterlassen."></p>
      <ul class="bullets" style="margin-top:16px">
        <li><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span data-en-html="Notes on parts <b>you haven't read stay closed</b> until your reading gets there." data-de-html="Notizen zu Teilen, <b>die du noch nicht gelesen hast, bleiben zu</b>, bis dein Lesen dort ankommt."></span></li>
        <li><svg class="ico" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span data-en-html="Anna and her other friends here see <b>which part you're in</b>. Never a page or a percent." data-de-html="Anna und ihre anderen Freunde hier sehen, <b>in welchem Teil du bist</b>. Nie eine Seite oder Prozent."></span></li>
        <li><svg class="ico" viewBox="0 0 24 24"><path d="M5 6h14v9H9l-4 3z"/></svg>
          <span data-en-html="Reply and react <b>whenever you read it</b>, days or months later." data-de-html="Antworte und reagiere, <b>wann immer du es liest</b>, Tage oder Monate später."></span></li>
      </ul>
      <h3 class="eyebrow" style="margin:22px 0 8px" data-en="Your copy" data-de="Dein Exemplar"></h3>
      <div class="rowgroup">
        <div class="radio"><span data-en="Paperback, 384 pages · Want to read" data-de="Taschenbuch, 384 Seiten · Will ich lesen"></span><span class="chk">✓</span></div>
      </div>
      <div class="btn primary" style="margin-top:20px" data-en="Open Anna's notes" data-de="Annas Notizen öffnen"></div>
      <p class="footnote faint" style="text-align:center;margin-top:10px" data-en="You can leave any time." data-de="Du kannst jederzeit gehen."></p>
    </div>
  </section>
</div>
<script src="mock.js"></script>
</body>
</html>
