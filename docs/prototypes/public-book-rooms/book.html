<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Notes on a Book 1: the friend's Book page (Want to read)</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="room.css" />
<style>
  .hero { position: relative; display: flex; flex-direction: column; align-items: center; padding: 100px 20px 0; text-align: center; }
  .facts { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-ink-faint); margin-top: 8px; }
  .actions { padding: 20px 20px 0; display: flex; flex-direction: column; gap: 6px; }
  .cap { text-align: center; font-size: 13px; color: var(--color-ink-muted); margin-bottom: 6px; }
  .sec { padding: 18px 20px 0; }
  .noterow { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; position: relative; }
  .noterow + .noterow::before { content: ''; position: absolute; top: 0; left: 58px; right: 0; height: 0.5px; background: var(--color-hairline); }
  .noterow .t { flex: 1; min-width: 0; }
  .noterow .t b { display: block; font-weight: 500; font-size: 15px; }
  .noterow .t span { display: block; font-size: 13px; color: var(--color-ink-faint); }
  .new { outline: 1.5px dashed var(--color-accent); outline-offset: 5px; border-radius: 14px; }
</style>
</head>
<body>
<div class="phone">
  <div class="glow"></div>
  <div class="status-bar"><span>9:41</span><span class="mono" style="font-size:12px;letter-spacing:2px">▪▪▪ ▮</span></div>
  <div class="round" style="left:20px"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></div>
  <div class="round" style="right:20px"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="18" cy="12" r=".8"/></svg></div>

  <div class="hero">
    <div class="cover xl c3"><span class="t">The Salt Orchard</span><span class="a">Ilse Varga</span></div>
    <h1 class="serif headline" style="margin-top:24px">The Salt Orchard</h1>
    <p class="body-large muted" style="margin-top:6px">Ilse Varga</p>
    <p class="facts" data-en="2023 · 384 pages · Want to read" data-de="2023 · 384 Seiten · Will ich lesen"></p>
  </div>

  <div class="actions">
    <div class="btn quiet"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span data-en="Start reading" data-de="Mit dem Lesen beginnen"></span></div>
    <div class="btn quiet" style="margin-top:6px"><svg viewBox="0 0 24 24"><path d="M5 6h14v9H9l-4 3z"/></svg><span data-en="Read together" data-de="Gemeinsam lesen"></span></div>
    <p class="cap" data-en="Read it with friends, or leave notes for them." data-de="Lies es mit Freunden oder hinterlass ihnen Notizen."></p>
  </div>

  <div class="sec">
    <h2 class="eyebrow" style="margin-bottom:8px" data-en="Notes from friends" data-de="Notizen von Freunden"></h2>
    <div class="rowgroup new">
      <div class="noterow"><span class="av photo">AS</span><span class="t"><b data-en="Anna's notes" data-de="Annas Notizen"></b><span data-en="14 notes · they open as you read" data-de="14 Notizen · sie öffnen sich beim Lesen"></span></span><span class="chev">›</span></div>
    </div>
  </div>

  <nav class="tabbar">
    <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
    <svg viewBox="0 0 24 24" style="color:var(--color-ink)"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15 5l3-1 3 15-3 1z"/></svg>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
  </nav>
  <div class="note" style="bottom:100px" data-en="New: a friend's notes on any edition of this Book, shown to her friends only." data-de="Neu: die Notizen einer Freundin zu jeder Ausgabe des Buchs, nur für ihre Freunde."></div>
</div>
<script src="mock.js"></script>
</body>
</html>
