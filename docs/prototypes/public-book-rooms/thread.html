<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Notes on a Book 4: a chapter's thread, weeks apart</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="room.css" />
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span class="mono" style="font-size:12px;letter-spacing:2px">▪▪▪ ▮</span></div>
  <div class="topbar">
    <div class="round"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></div>
    <div class="mid"><h1 data-en="Chapter 1 · The well" data-de="Kapitel 1 · Der Brunnen"></h1><p class="range" data-en="pp. 1–38" data-de="S. 1–38"></p></div>
    <div></div>
  </div>

  <div class="msgs">
    <p class="day">12 Oct</p>
    <div class="msg">
      <p class="who">Anna</p>
      <div class="line"><span class="av photo">AS</span>
        <div class="bub"><span data-en="The first line is the whole book in miniature. Keep an eye on the salt." data-de="Der erste Satz ist das ganze Buch im Kleinen. Achte auf das Salz."></span><span class="react">❤️</span></div>
      </div>
    </div>
    <div class="msg" style="margin-top:6px">
      <div class="line"><span class="av" style="visibility:hidden"></span>
        <div class="bub"><span data-en="The mother is lying about the well. I'm sure of it." data-de="Die Mutter lügt über den Brunnen. Da bin ich sicher."></span></div>
      </div>
    </div>
    <div class="msg">
      <div class="line"><span class="av photo">AS</span>
        <div class="bub veil"><svg class="ico" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M3 12s3.5-6 9-6c1.6 0 3 .5 4.2 1.2M21 12s-3.5 6-9 6c-1.6 0-3-.5-4.2-1.2M4 4l16 16"/></svg><span data-en="Spoiler for later · tap to show" data-de="Spoiler für später · zum Anzeigen tippen"></span></div>
      </div>
    </div>

    <p class="day" data-en="Today" data-de="Heute"></p>
    <div class="msg mine">
      <div class="line"><div class="bub"><div class="quote">Anna: <span data-en="The mother is lying about the well…" data-de="Die Mutter lügt über den Brunnen…"></span></div><span data-en="Only just got here. You're right, she never looks at it." data-de="Bin gerade erst hier. Du hast recht, sie schaut nie hin."></span></div></div>
    </div>
  </div>

  <div class="composer">
    <div class="chips"><span class="chip" data-en="Spoiler" data-de="Spoiler"></span></div>
    <div class="box"><span class="ph" data-en="Reply to Anna's notes" data-de="Auf Annas Notizen antworten"></span>
      <span class="send"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span></div>
  </div>
  <div class="note" style="bottom:auto;top:120px;right:8px;max-width:170px" data-en="Same thread screen as a buddy read; days apart, the day separators carry the time." data-de="Derselbe Thread wie im Buddy-Read; Tage dazwischen tragen die Datumszeilen."></div>
</div>
<script src="mock.js"></script>
</body>
</html>
