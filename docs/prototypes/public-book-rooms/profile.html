<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Notes on a Book 6: a friend's profile</title>
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="room.css" />
<style>
  .hero { display: flex; flex-direction: column; align-items: center; padding: 100px 20px 0; text-align: center; }
  .sec { padding: 22px 20px 0; }
  .covers { display: flex; gap: 10px; overflow: hidden; }
  .nrow { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 14px; position: relative; }
  .nrow + .nrow::before { content: ''; position: absolute; top: 0; left: 64px; right: 0; height: 0.5px; background: var(--color-hairline); }
  .nrow .t { flex: 1; min-width: 0; } .nrow .t b { display: block; font: 500 15px/20px var(--font-serif); }
  .nrow .t span { display: block; font-size: 13px; color: var(--color-ink-faint); }
  .cover.s { width: 34px; border-radius: 2px; padding: 3px; } .cover.s .t { font-size: 4.5px; } .cover.s .a { font-size: 2.5px; }
  .new { outline: 1.5px dashed var(--color-accent); outline-offset: 5px; border-radius: 14px; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span class="mono" style="font-size:12px;letter-spacing:2px">▪▪▪ ▮</span></div>
  <div class="round" style="left:20px"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></div>
  <div class="hero">
    <span class="av photo lg">AS</span>
    <h1 class="serif headline" style="margin-top:14px">Anna Sommer</h1>
    <p class="caption faint" style="margin-top:4px" data-en="You follow each other" data-de="Ihr folgt euch gegenseitig"></p>
  </div>

  <div class="sec">
    <h2 class="eyebrow" style="margin-bottom:8px" data-en="Her notes on books" data-de="Ihre Notizen zu Büchern"></h2>
    <div class="rowgroup new">
      <div class="nrow"><div class="cover s c3"><span class="t">The Salt Orchard</span><span class="a">I. Varga</span></div><span class="t"><b>The Salt Orchard</b><span data-en="14 notes · on your Want to read" data-de="14 Notizen · auf deiner Leseliste"></span></span><span class="chev">›</span></div>
      <div class="nrow"><div class="cover s c5"><span class="t">Night Ferry</span><span class="a">O. Lund</span></div><span class="t"><b>Night Ferry</b><span data-en="5 notes · you finished it" data-de="5 Notizen · du hast es beendet"></span></span><span class="chev">›</span></div>
    </div>
  </div>

  <div class="sec">
    <h2 class="eyebrow" style="margin-bottom:10px" data-en="Potential buddy reads" data-de="Mögliche Buddy-Reads"></h2>
    <div class="covers">
      <div class="cover md c1"><span class="t">A Quiet Year</span><span class="a">M. Hale</span></div>
      <div class="cover md c4"><span class="t">Glasshouse</span><span class="a">T. Ren</span></div>
      <div class="cover md c6"><span class="t">The Winter Pact</span><span class="a">Mara Ellis</span></div>
      <div class="cover md c2"><span class="t">North</span><span class="a">K. Aho</span></div>
    </div>
  </div>

  <nav class="tabbar">
    <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15 5l3-1 3 15-3 1z"/></svg>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
  </nav>
</div>
<script src="mock.js"></script>
</body>
</html>
