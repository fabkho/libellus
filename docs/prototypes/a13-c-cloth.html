<body>
<div class="column">

<script>
const VARIANT = 'c'
const $ = (id) => document.getElementById(id)
const root = document.documentElement

const NOTES = {
  a: '<b>(a) Glyph tile.</b> A new <code>collections</code> glyph (the fan itself, in outline: a cover and the edges of two behind it, on the 24 grid, 1.5 stroke, round caps) in <code>clothInk</code> on a 40 px <code>cloth4</code> square with the icon tile\'s <code>sm</code> radius. Reads as an icon: "this is where Collections are".',
  b: '<b>(b) Bookends.</b> Line art in <code>inkFaint</code>, the empty state\'s own language (the lamp over a shelf): a hairline upright and two thin spines leaning on it, standing on the shelf\'s rule. Weightless; nothing filled; no colour.',
  c: '<b>(c) Cloth board.</b> A 40 px square of <code>cloth2</code> with the Placeholder cover\'s finish (spine crease, inset hairline rule at 35 % <code>clothInk</code>) and, for its mark, an empty shelf: the mark\'s hairline as the shelf and the dashed outline of the next book leaning on it (the empty state\'s "outline of the next one"). An empty Collections row reads as an empty shelf.',
}
const ANSWERS = `
<p><b>States.</b> <i>Loading</i>: the art as at none, the count blank (no width to reserve: it sits at the row's end). If the list turns out to have covers, the fan fades in over the art and the art fades out, over <code>standard</code>, in place (a cover fading in, MOTION.md tokens); nothing travels, nothing resizes. With Reduce Motion: a swap. If it turns out none: nothing changes but the count. <i>None</i>: the art, the count at zero. <i>Some</i>: the fan, as today. <i>Collections, none with a cover</i> (today a bare rectangle and "2"): the art and the count.</p>
<p><b>Count at zero: "0".</b> The Library's own segment tabs show their count at zero as "0" in the same <code>figures</code> caption; a word ("None") reads as copy where every other row has a figure, and nothing reads as still loading. "0" keeps the accessible name honest: "Collections 0" (the art stays <code>aria-hidden</code>).</p>
<p><b>only-if-any: keep it.</b> An empty Library's empty state has one way forward (the search prompt; DESIGN.md, UiEmptyState); a way to Collections there is a second door into an empty room. With a real empty state the row no longer looks broken, so where it shows (a Library with Books, or an empty Library that has Collections) it is a calm entry, not a hole. Collections are made on the Collections page (reached through this row) or from a Book's "Add to collection", and the first Book is what fills an empty Library; once there is one, the row is there. If the device's copy says Collections exist, the row is there in the first frame; on a first visit it opens like a <code>Reveal</code> (over <code>standard</code>, the empty state glides down), never pops.</p>
<p><b>Rules.</b> Only opacity moves, only when covers replace the art; nothing moves for its own sake; with Reduce Motion nothing moves. The row keeps its name ("Collections" + count); the art is <code>aria-hidden</code> like the fan.</p>
<p><b>Recommendation: (c)</b>. It is a cover-shaped object in the slot where covers sit, so none and some read as the same shelf, empty or not, and the cloth carries colour the way covers do (DESIGN.md: covers carry the colour; the chrome stays ink). (a) is a fine icon but a tile is chrome-language, nowhere else in the app; (b) is the lightest and most "D", but at 45 px the line art is faint on <code>fill</code> and reads as loading in the light room.</p>`

// ---------------------------------------------------------------- art
const GLYPH = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: var(--stroke-icon)" aria-hidden="true"><rect x="3.5" y="6.5" width="10" height="13.5" rx="1.2"/><path d="M15.5 8.5h.8a1 1 0 0 1 1 1V20"/><path d="M19.5 10.5h.3a1 1 0 0 1 1 1V20"/></svg>`
const BOOKENDS = `<svg width="50" height="45" viewBox="0 0 50 45" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><path d="M.5 44.5h44"/><path d="M3 44.5V10" stroke-width=".75"/><rect x="6.5" y="14" width="5" height="30.5" rx="1.2" transform="rotate(-5 6.5 44.5)"/><rect x="17" y="16.5" width="4.5" height="28" rx="1.2" transform="rotate(-16 17 44.5)"/></svg>`
const CLOTH = `<svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="1" stroke="currentColor" stroke-opacity=".35" stroke-width=".5"/><path d="M8.5 30.5h23" stroke="currentColor" stroke-opacity=".6" stroke-width=".75"/><rect x="12" y="13" width="5.5" height="17.5" rx="1" stroke="currentColor" stroke-opacity=".6" stroke-width=".75"/><rect x="19.5" y="15" width="5.5" height="15.5" rx="1" stroke="currentColor" stroke-opacity=".6" stroke-width=".75" stroke-dasharray="1.6 1.4" transform="rotate(14 25 30.5)"/></svg>`
const ART = { a: `<span class="art-a">${GLYPH}</span>`, b: `<span class="art-b">${BOOKENDS}</span>`, c: `<span class="art-c">${CLOTH}</span>` }

const cover = (bg, fg, sun) => `url('data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 90'><rect width='60' height='90' fill='${bg}'/><circle cx='38' cy='52' r='13' fill='${sun}'/><path d='M0 66 C20 60 40 66 60 61 V90 H0Z' fill='${fg}'/><path d='M14 18h32' stroke='${sun}' stroke-width='3'/></svg>`).replaceAll("'", '%27')}')`
const COVERS = [cover('#2c4a5c', '#1b2d38', '#e8b56a'), cover('#7a3b2e', '#4b2219', '#f0d9a8'), cover('#d9cdb6', '#8a7e66', '#3b5d6b')]

let zero = '0'
let loading = false

function row(state, opts = {}) {
  // state: loading | none | some | emptyCollections
  const count = state === 'loading' ? '' : state === 'none' ? zero : state === 'some' ? '3' : '2'
  const showFan = state === 'some'
  const fan = `<span class="covers ${showFan ? '' : 'out'}">${COVERS.map((c, i) => `<span class="f fan-${i}"><span style="background-image:${c}"></span></span>`).join('')}</span>`
  const art = opts.today ? '<span class="art"><span class="today-empty"></span></span>' : `<span class="art ${showFan ? 'out' : ''}">${ART[VARIANT]}</span>`
  return `<a href="#" class="lrow" data-state="${state}" onclick="return false">
    <span class="fan" aria-hidden="true">${art}${fan}</span>
    <span class="name">Collections</span>
    <span class="count figures" data-count>${count}</span>
    <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: var(--stroke-icon-bold)" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg>
  </a>`
}
const STATES = [
  ['loading', 'loading', 'collections.loaded false: the art, no count'],
  ['none', 'none', 'no Collections'],
  ['some', 'some', 'three Collections with covers: the fan, as today'],
  ['emptyCollections', 'some, none with a cover', 'two Collections, both empty: today a bare rectangle and "2"'],
]
function renderStates(el) {
  el.innerHTML = STATES.map(([s, label, hint]) => `<div class="state"><span class="eyebrow">${label} <i>· ${hint}</i></span>${row(s)}</div>`).join('')
}
function render() {
  renderStates($('statesLight')); renderStates($('statesDark'))
  $('today').innerHTML = row('none', { today: true }).replace(`data-count>${zero}<`, 'data-count><')
  renderEmptyLibrary()
}

let gate = 'keep', have = 0
function renderEmptyLibrary() {
  const shown = gate === 'always' || have > 0
  const lamp = `<svg viewBox="0 0 240 250" fill="none" aria-hidden="true"><path d="M120 0v52" stroke="currentColor"/><path d="M104 52h32l12 26H92z" stroke="currentColor" stroke-linejoin="round"/><path d="M92 78 52 214h136L148 78" fill="url(#cone)"/><rect x="80" y="132" width="22" height="82" rx="2" stroke="currentColor"/><rect x="106" y="146" width="18" height="68" rx="2" stroke="currentColor"/><rect x="132" y="140" width="20" height="74" rx="2" stroke="currentColor" stroke-dasharray="3 4" transform="rotate(12 142 214)"/><path d="M36 214.5h168" stroke="currentColor"/><defs><linearGradient id="cone" x1="120" y1="78" x2="120" y2="214" gradientUnits="userSpaceOnUse"><stop style="stop-color: var(--color-lamp-cone)"/><stop offset="1" style="stop-color: var(--color-lamp-cone); stop-opacity: 0"/></linearGradient></defs></svg>`
  const r = shown ? row(have > 0 ? 'emptyCollections' : 'none').replace(/data-count>[^<]*</, `data-count>${have > 0 ? have : zero}<`) : ''
  $('emptyLib').innerHTML = `${r}
    <div class="lamp" style="padding-top: var(--spacing-${shown ? 'lg' : 'xl'})">
      <div class="art-box"><span class="pool2"></span>${lamp}</div>
      <h3 class="book-title t-headline">Your library is empty</h3>
      <p class="t-subhead muted">The books you add live here: what you want to read, what you are reading, what you have read.</p>
      <div class="prompt"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.5 4.5"/></svg><span>Search</span></div>
    </div>`
}

async function replay() {
  if (loading) return
  loading = true
  const rows = [...document.querySelectorAll('#statesLight .lrow, #statesDark .lrow')].filter((r) => r.dataset.state !== 'loading')
  for (const r of rows) {
    r.querySelector('[data-count]').textContent = ''
    r.querySelector('.covers').classList.add('out'); r.querySelector('.art').classList.remove('out')
  }
  await new Promise((res) => setTimeout(res, 1100))
  for (const r of rows) {
    const s = r.dataset.state
    r.querySelector('[data-count]').textContent = s === 'none' ? zero : s === 'some' ? '3' : '2'
    if (s === 'some') { r.querySelector('.covers').classList.remove('out'); r.querySelector('.art').classList.add('out') }
  }
  loading = false
}

const press = (sel, attr, value) => document.querySelectorAll(sel).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === value)))
document.querySelectorAll('[data-zero]').forEach((b) => b.addEventListener('click', () => { zero = b.dataset.zero; press('[data-zero]', 'zero', zero); render() }))
document.querySelectorAll('[data-gate]').forEach((b) => b.addEventListener('click', () => { gate = b.dataset.gate; press('[data-gate]', 'gate', gate); renderEmptyLibrary() }))
document.querySelectorAll('[data-have]').forEach((b) => b.addEventListener('click', () => { have = Number(b.dataset.have); press('[data-have]', 'have', String(have)); renderEmptyLibrary() }))
$('replay').addEventListener('click', replay)
$('reduce').checked = matchMedia('(prefers-reduced-motion: reduce)').matches
root.toggleAttribute('data-reduce', $('reduce').checked)
$('reduce').addEventListener('change', (e) => root.toggleAttribute('data-reduce', e.target.checked))
$('protoToggle').addEventListener('click', (e) => { const closed = $('proto').classList.toggle('closed'); e.target.textContent = closed ? 'show' : 'hide'; e.target.setAttribute('aria-expanded', String(!closed)) })
$('note').innerHTML = NOTES[VARIANT]
$('answers').innerHTML = ANSWERS
render()
const q = new URLSearchParams(location.search)
if (q.has('closed')) $('protoToggle').click()
if (q.has('bare')) $('proto').style.display = 'none'
</script>
</body>
</html>
